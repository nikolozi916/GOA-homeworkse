<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Inline CSS სტილი მოცემულია HTML ელემენტის შიგნით, style ატრიბუტით -->
    <!-- Internal CSS: სტილი მოცემულია HTML დოკუმენტის <head> სექციაში <style> ტეგის შიგნით -->
    <!-- External CSS: სტილი მოცემულია ცალკე .css ფაილში და HTML-ში დაკავშირებულია <link> თეგით --> 
     <!-- Inline CSS სტილი მოცემულია HTML ელემენტის შიგნით, style ატრიბუტით -->
    <!-- CSS-ში მემკვიდრეობა არის მექანიზმი, რომლის დროსაც შვილობილი ელემენტები ავტომატურად იღებენ გარკვეულ სტილებს მაგალითად, ფერს, ფონტს მშობლიური ელემენტიდან. -->
    <!-- სელექტორი არის CSS სინტაქსის ნაწილი, რომელიც ზუსტად განსაზღვრავს, რომელ HTML ელემენტს ან ელემენტებს უნდა გამოეყენოს სტილი. -->
    <!-- CSS-ში ID და Class სელექტორები გამოიყენება HTML ელემენტების სტილიზაციისთვის, მაგრამ მათ შორის არსებობს ფუნდამენტური განსხვავება გამოყენების დანიშნულებაში და გამეორების შესაძლებლობაში. -->
     
</body>
</html>
