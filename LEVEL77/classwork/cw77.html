<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Preview Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="card-container">
        <article class="blog-card">
            <div class="card-image">
                <img src="goa.png" alt="">
                    <rect width="336" height="200" fill="#F4D04E"/>
                    <path fill="#000" fill-rule="evenodd" d="M190.5 40h-85a15 15 0 0 0-15 15v90a15 15 0 0 0 15 15h85a15 15 0 0 0 15-15V55a15 15 0 0 0-15-15Zm-85-10h85a25 25 0 0 1 25 25v90a25 25 0 0 1-25 25h-85a25 25 0 0 1-25-25V55a25 25 0 0 1 25-25Z" clip-rule="evenodd"/>
                    <path fill="#000" d="M117 76h31v10h-31zM117 96h62v10h-62zM117 116h49v10h-49z"/>
                </svg>
            </div>
            <div class="card-content">
                <span class="badge">Learning</span>
                <p class="publish-date">Published 21 Dec 2023</p>
                <h1 class="card-title"><a href="#">HTML & CSS foundations</a></h1>
                <p class="card-description">
                    These languages are the backbone of every <br> website, defining structure, content, and <br> presentation.
                </p>
            </div>
            <footer class="card-author">
                <div class="author-avatar">
                    <img src="image.png" alt="">
                        <circle cx="16" cy="16" r="16" fill="#F4D04E"/>
                        <circle cx="16" cy="13" r="5" fill="#000"/>
                        <path fill="#000" d="M7 26.5c0-4.5 4-7.5 9-7.5s9 3 9 7.5V28H7v-1.5Z"/>
                    </svg>
                </div>
                <span class="author-name">Greg Hooper</span>
            </footer>
        </article>
    </main>
</body>
</html>
