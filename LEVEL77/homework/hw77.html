<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <title>პროდუქტის ქარდი</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="product-card">
        <div class="product-image">
            <img src="image.png" alt="Gabrielle Essence Eau De Parfum">
        </div>
        <div class="product-content">
            <span class="category">P E R F U M E</span>
            <h1>Gabrielle Essence Eau De Parfum</h1>
            <p class="description">
                A floral, solar and voluptuous interpretation composed by Olivier Polge, Perfumer-Creator for the House of CHANEL.
            </p>
            <div class="price-box">
                <span class="current-price">$149.99</span>
                <span class="old-price">$169.99</span>
            </div>
            <button class="cart-btn">
                <img src="yy.png" alt="">
                <p>add to cart</p>
            </button>
        </div>
    </div>
</body>
</html>




<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <div class="bg-pattern-top"></div>
  <div class="bg-pattern-bottom"></div>

  <main class="card-container">
    <div class="card">
      <div class="card-header"></div>
      
      <div class="card-body">
        <div class="avatar-container">
          <img src="chiil.png" alt="Victor Crest" class="avatar">
        </div>
        
        <h1 class="name">
          Victor Crest <span class="age">26</span>
        </h1>
        <p class="location">London</p>
      </div>

      <div class="card-footer">
        <div class="stat">
          <span class="number">80K</span>
          <span class="label">Followers</span>
        </div>
        <div class="stat">
          <span class="number">803K</span>
          <span class="label">Likes</span>
        </div>
        <div class="stat">
          <span class="number">1.4K</span>
          <span class="label">Photos</span>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
